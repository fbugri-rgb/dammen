# Bouwt het damspel voor Windows, macOS en Linux, telkens met Java erin, zodat
# spelers niets hoeven te installeren.
#
#  - Een tag pushen (bv. "git tag v1.0.0 && git push origin v1.0.0") maakt een
#    release op GitHub met de drie downloads.
#  - Via het tabblad Actions > Builds > "Run workflow" kan het ook met de hand;
#    de downloads staan dan onderaan bij de run (Artifacts).
name: Builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: Dammen-windows.zip
          - os: macos-latest
            file: Dammen-macos-apple-silicon.dmg
          - os: macos-15-intel
            file: Dammen-macos-intel.dmg
          - os: ubuntu-latest
            file: Dammen-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./mvnw.cmd -B test; else ./mvnw -B test; fi

      - name: Programma maken
        shell: bash
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.file }}
          path: target/dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Release maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Download het bestand voor jouw computer. Java installeren is niet nodig.

          - **Windows:** Dammen-windows.zip uitpakken en Dammen.exe in de map Dammen openen. Klik bij "Windows heeft uw pc beschermd" op *Meer info* > *Toch uitvoeren*.
          - **macOS:** Dammen-macos-apple-silicon.dmg (Mac met M1 of nieuwer) of Dammen-macos-intel.dmg (oudere Mac met Intel-processor; te zien via Apple-menu > Over deze Mac) openen en Dammen naar Programma's slepen. De eerste keer: Systeeminstellingen > Privacy en beveiliging > *Toch openen*.
          - **Linux:** Dammen-linux.tar.gz uitpakken en Dammen/bin/Dammen starten.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Dammen $GITHUB_REF_NAME" --notes-file notes.md
